name: Public release gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Use Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: python3 -m pip install --requirement requirements-analysis.txt

      - name: Regression tests
        run: python3 scripts/run_release_regressions.py

      - name: Structural framework lint
        run: python3 framework/scripts/legend_lint.py .

      - name: Public release gate
        if: always()
        run: |
          python3 scripts/public_release_gate.py \
            --root . \
            --mode release \
            --report-json public-release-report.json

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-release-report
          path: public-release-report.json
          if-no-files-found: warn
