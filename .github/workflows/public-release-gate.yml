name: Public release gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    env:
      # Packaged Chrome has Ubuntu's sandbox profile; the raw Chromium snapshot does not.
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # full history: test_task_record_commit_hashes resolves historical commits named in task records

      - name: Use Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: python3 -m pip install --requirement requirements-analysis.txt

      - name: Browser startup and keyboard regression
        run: |
          python3 - <<'PY'
          import subprocess
          import sys
          sys.path.insert(0, "framework/scripts")
          from repurposing_view import find_chromium
          binary = find_chromium()
          if not binary:
              raise SystemExit("CI browser checks require Chromium or Chrome")
          print(f"Browser: {binary}", flush=True)
          subprocess.run([binary, "--version"], check=True, timeout=15)
          PY
          python3 framework/scripts/test_repurposing_view.py CdpStartup \
            Browser.test_every_chain_node_can_be_selected_by_keyboard_and_shows_its_relations -v

      - name: Regression tests
        # The log is long and its detail needs a login to read; the failing suites and assertion lines are repeated as annotations,
        # which the check-runs API serves without one (IT30: a red run on 0845ed06 could not be diagnosed from outside).
        run: |
          set +e
          python3 scripts/run_release_regressions.py > regression.log 2>&1
          rc=$?
          tail -n 60 regression.log
          if [ "$rc" -ne 0 ]; then
            grep -E "^(REGRESSION VERDICT|FAIL:|ERROR: test|AssertionError|[A-Za-z_.]*(Error|Exception):|- .*: exit [1-9])|^TIME .*exit [1-9]" regression.log | head -40 | cut -c1-300 | while IFS= read -r l; do echo "::error title=release regression::$l"; done
          fi
          exit "$rc"

      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regression-log
          path: regression.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Structural framework lint
        run: python3 framework/scripts/legend_lint.py .

      - name: Public release gate
        if: always()
        run: |
          python3 scripts/public_release_gate.py \
            --root . \
            --mode release \
            --report-json public-release-report.json

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-release-report
          path: public-release-report.json
          if-no-files-found: warn
